name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - run: bun install --frozen-lockfile

      # A custom domain (public/CNAME) serves the site at "/", so does a user/site
      # repo (<name>.github.io). A project repo without one serves at "/<repo>/".
      # The build bakes this path into the page's asset links, so it has to match.
      - name: Set the Pages base path
        run: |
          repo="${GITHUB_REPOSITORY#*/}"
          if [[ -f public/CNAME || "$repo" == *.github.io ]]; then
            echo "PAGES_BASE=/" >> "$GITHUB_ENV"
          else
            echo "PAGES_BASE=/$repo/" >> "$GITHUB_ENV"
          fi

      - run: bun run build

      # Check the rendered homepage, not just an empty output folder.
      - name: Verify the static output exists
        run: |
          if [[ ! -s dist/client/index.html ]]; then
            echo "::error::The static homepage is missing from dist/client/index.html."
            ls -la dist dist/client .output .output/public 2>/dev/null || true
            exit 1
          fi
          ls -la dist/client

      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist/client
          include-hidden-files: true

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
